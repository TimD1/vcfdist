- name: test_help
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist -h'

- name: test_small-var_phased_single-phaseset_chr20
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist "${VCFDIST_REPO_PATH}/tests/integration/data/query_chr20.vcf.gz" "${VCFDIST_REPO_PATH}/tests/integration/data/truth_chr20.vcf.gz" "${VCFDIST_REPO_PATH}/tests/integration/data/GCA_000001405.15_GRCh38_no_alt_analysis_set_chr20.fasta" -b "${VCFDIST_REPO_PATH}/tests/integration/data/chr20.bed"'

# --- single-pass FN dropping / swallowing-recovery scenarios (synthetic sc1 reference) ---
# All scenarios share tests/integration/data/synthetic.fasta (400bp contig "sc1") and
# tests/integration/data/synthetic.bed (whole-contig region).

- name: test_single-pass_large-fn-sv-recovers-snps
  # swallowed_snps: truth has a 100bp deletion (pos 150) plus 3 nearby SNPs (140, 146, 256);
  # query has the 3 SNPs but not the deletion. Verifies the SNPs are recovered as TP and
  # the deletion is labeled FN in a single pass, without the SNPs being swallowed into the
  # deletion's sync group.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/swallowed_snps_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/swallowed_snps_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -p "swallowed_snps_out_"'
  files:
    - path: swallowed_snps_out_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t6\t6\t0\t0"
        - "SV\tNONE\t0\t0\t0\t2\t0"
    - path: swallowed_snps_out_summary.vcf
      contains:
        - "sc1\t140\t.\tT\tC"
        - "sc1\t146\t.\tG\tA"
        - "sc1\t256\t.\tG\tA"
        - ":TP,TP:1,1:"
        - ":FN,FN:0,0:"
      must_not_contain:
        - ":FP"

- name: test_single-pass_partial-match-tp-at-lenient-ct
  # partial_match_del (-ct 0.7): truth has a 10bp deletion (pos 150); query has an 8bp
  # deletion at the same anchor (partial match, query_dist=2, credit = 1 - 2/10 = 0.8).
  # At a lenient threshold of -ct 0.7 this clears the bar and is TP. (The tool default of 0.98
  # would not, so -ct is set explicitly here for the partial match to count as TP.)
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/partial_match_del_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/partial_match_del_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -ct 0.7
    -p "partial_match_del_ct07_"'
  files:
    - path: partial_match_del_ct07_precision-recall-summary.tsv
      contains:
        - "INDEL\tNONE\t0\t2\t2\t0\t0"
    - path: partial_match_del_ct07_summary.vcf
      contains:
        - ":TP,TP:0.8,0.8:"
      must_not_contain:
        - ":FN"
        - ":FP"

- name: test_single-pass_ct1-exact-match-only
  # partial_match_del (-ct 1.0): same partially-matched 10bp-vs-8bp deletion as above, but
  # with -ct 1.0 (bypass toll (1-ct)*len = 0), only an exact match stays on-path. The
  # 0.8-credit variant is bypassed: truth becomes FN, the query call becomes FP.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/partial_match_del_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/partial_match_del_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -ct 1.0
    -p "partial_match_del_ct1_"'
  files:
    - path: partial_match_del_ct1_precision-recall-summary.tsv
      contains:
        - "INDEL\tNONE\t0\t0\t0\t2\t2"
    - path: partial_match_del_ct1_summary.vcf
      contains:
        - ":FN,FN:0,0:"
        - ":FP,FP:0,0:"
      must_not_contain:
        - ":TP"

- name: test_single-pass_colocated-spurious-call-no-distortion
  # colocated_spurious_snp: truth has a SNP (pos 200, A>G) the query misses entirely; query
  # has an unrelated spurious SNP call at the same position (A>C). Verifies the truth variant
  # is FN and the query call is FP independently, with no cross-crediting (the r=0 case).
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/colocated_spurious_snp_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/colocated_spurious_snp_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -p "colocated_spurious_snp_out_"'
  files:
    - path: colocated_spurious_snp_out_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t0\t0\t2\t2"
    - path: colocated_spurious_snp_out_summary.vcf
      contains:
        - "sc1\t200\t.\tA\tG"
        - "sc1\t200\t.\tA\tC"
        - ":FN,FN:0,0:"
        - ":FP,FP:0,0:"
      must_not_contain:
        - ":TP"

- name: test_single-pass_entangled-overlap-shared-credit
  # entangled_overlap_del (-ct 0.7), exploratory: truth has a 10bp deletion at anchor 150;
  # query has a different 10bp deletion at anchor 152 (8 of 10 deleted bases overlap, different
  # start position -- an interlocking/entangled locus). Observed at -ct 0.7: the aligner places
  # both in the SAME sync group and assigns both TP with credit 0.8, even though the two calls
  # do not share a start position -- a nonzero-r residual of cross-crediting distinct from the
  # clean r=0 colocated-spurious case above. This is documented/characterized, not asserted as
  # "correct" behavior.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/entangled_overlap_del_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/entangled_overlap_del_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -ct 0.7
    -p "entangled_overlap_del_out_"'
  files:
    - path: entangled_overlap_del_out_precision-recall-summary.tsv
      contains:
        - "INDEL\tNONE\t0\t2\t2\t0\t0"
    - path: entangled_overlap_del_out_summary.vcf
      contains:
        - ":TP,TP:0.8,0.8:"

- name: test_single-pass_adjacent-fn-no-overcredit
  # adjacent_fn_no_overcredit: regression guard for the consecutive-bypass excision fix.
  # Truth has a reproduced SNP (pos 300, TP) immediately followed by two adjacent missed SNPs
  # (pos 301, 302, both FN); query has only the pos-300 SNP. All three fall in one sync group,
  # so both FN bypass spans must be excised from the TP's reference edit distance (RD). The fix
  # yields RD=1 for the TP; leaving the inner bypass un-excised inflates it to RD=2. The call
  # stays TP either way (credit 1.0), so RD is the field that pins the fix.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/adjacent_fn_no_overcredit_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/adjacent_fn_no_overcredit_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -p "adjacent_fn_no_overcredit_out_"'
  files:
    - path: adjacent_fn_no_overcredit_out_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t2\t2\t4\t0"
    - path: adjacent_fn_no_overcredit_out_summary.vcf
      contains:
        - "sc1\t300\t.\tA\tC"
        - ":TP,TP:1,1:1,1:0,0:"
        - ":FN,FN:0,0:"
      must_not_contain:
        - ":TP,TP:1,1:2,"
        - ":FP"

- name: test_summary-vcf_one-record-per-variant
  # record_shapes: query and truth are identical, so every call is a gm TP and the record shape is
  # all that is under test. A homozygous call is one record carrying two values per per-haplotype
  # field, not two records; a CPX is split into an INS and a DEL at parse time and each half is one
  # such record. A het-alt (1|2) is the exception: parsing splits it into two entries with
  # different ALTs, which nothing rejoins, so it stays two co-located records, each reporting one
  # value for its ALT allele and '.' for its reference allele.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/record_shapes_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/record_shapes_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -p "record_shapes_out_"'
  files:
    - path: record_shapes_out_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t4\t4\t0\t0"
        - "INDEL\tNONE\t0\t6\t6\t0\t0"
    - path: record_shapes_out_summary.vcf
      contains:
        # hom SNP, hom CPX (as INS then DEL), and hom DEL: one record each, two values per field
        - "sc1\t200\t.\tA\tG\t50\tPASS\t.\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE\t1|1:TP,TP:1,1:1,1:0,0:gm,gm:50:0:3,3:0:0:.:.:.:.\t1|1:TP,TP:1,1:1,1:0,0:gm,gm:50:0:3,3:0:0:0:.:0:."
        - "sc1\t209\t.\tG\tGTT\t50\tPASS\t.\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE\t1|1:TP,TP:"
        - "sc1\t209\t.\tGCAAGA\tG\t50\tPASS\t.\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE\t1|1:TP,TP:"
        - "sc1\t220\t.\tCAACT\tC\t50\tPASS\t.\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE\t1|1:TP,TP:"
        # het-alt: two co-located records, each carrying '.' for its reference allele
        - "sc1\t250\t.\tA\tC\t50\tPASS\t.\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE\t1|0:TP,.:1,.:1,.:0,.:gm,.:50:1:0,.:0:0:.:.:.:.\t1|0:TP,.:"
        - "sc1\t250\t.\tA\tG\t50\tPASS\t.\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE\t0|1:.,TP:.,1:.,1:.,0:.,gm:50:1:.,0:0:0:.:.:.:.\t0|1:.,TP:"
      must_not_contain:
        # the pre-#103 shape: a homozygous call written once per haplotype
        - "\t1|0:TP:"
        - "\t0|1:TP:"

- name: test_summary-vcf_preserves-source-fields
  # preserved_fields: ID, QUAL, FILTER, and INFO are sourced from the input rather than written as
  # the placeholders '.', '.', PASS, and '.', and the source record's FORMAT keys are appended to
  # the fixed list. Each record's columns come from the callset that owns it: the query for the
  # three it calls, the truth for the false negative it alone calls at 256. The callset that does
  # not own a record has no values for the appended keys and writes '.' for each.
  #
  # The query declares one Number=1 (DP, SDP), one fixed Number=2 (SB, SAC), and one Flag
  # (SOMATIC) field, all of which survive; its Number=A/R/G fields (AF, AD, PL) are ALT-indexed
  # and are dropped, since the emitted alleles are normalized and split rather than the original
  # ALT list they index into.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/preserved_fields_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/preserved_fields_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -p "preserved_fields_out_"'
  stderr:
    contains:
      - "3 ALT-indexed (Number=A/R/G) field(s) in QUERY VCF, left out of the summary VCF"
      - "FORMAT/AD, FORMAT/PL, INFO/AF"
  files:
    - path: preserved_fields_out_summary.vcf
      contains:
        # every preserved field is declared, and the dropped ones are not
        - "##FILTER=<ID=LowConf,Description=\"Low confidence call\">"
        - "##INFO=<ID=DP,Number=1,Type=Integer,Description=\"Total read depth\">"
        - "##INFO=<ID=SB,Number=2,Type=Integer,Description=\"Forward and reverse strand read counts\">"
        - "##INFO=<ID=SOMATIC,Number=0,Type=Flag,Description=\"Somatic call\">"
        - "##INFO=<ID=TRUTHSET,Number=1,Type=String,Description=\"Truth set the call came from\">"
        - "##FORMAT=<ID=SDP,Number=1,Type=Integer,Description=\"Sample read depth\">"
        - "##FORMAT=<ID=SAC,Number=2,Type=Integer,Description=\"Forward and reverse sample read counts\">"
        # the merged record of a 1|1 call carries the query's columns; the truth sample pads
        - "sc1\t200\trs200\tA\tG\t31\tPASS\tDP=30;SB=11,19;SOMATIC\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE:SDP:SAC\t1|1:TP,TP:1,1:1,1:0,0:gm,gm:60:0:2,2:0:0:.:.:.:.:.:.\t1|1:TP,TP:1,1:1,1:0,0:gm,gm:31:0:2,2:0:0:0:.:0:.:29:12,17"
        # both halves of the CPX split carry the one source record's columns, FILTER included
        - "sc1\t209\trs210\tG\tGTT\t32\tLowConf\tDP=31;SB=12,19\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE:SDP:SAC\t"
        - "sc1\t209\trs210\tGCAAGA\tG\t32\tLowConf\tDP=31;SB=12,19\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE:SDP:SAC\t"
        # both co-located entries of the het-alt record carry it too
        - "sc1\t250\trs250\tA\tC\t33\tPASS\tDP=32;SOMATIC\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE:SDP:SAC\t"
        - "sc1\t250\trs250\tA\tG\t33\tPASS\tDP=32;SOMATIC\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE:SDP:SAC\t"
        # a pure FN is owned by the truth, so its columns and its lone FORMAT key are the truth's
        - "sc1\t256\ttv256\tG\tA\t60\tPASS\tDP=98;TRUTHSET=hc\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE:SDP\t1|1:FN,FN:0,0:.,.:.,.:.,.:60:1:0,0:0:1:.:.:.:.:97\t.:.:.:.:.:.:.:1:.:.:1:.:.:.:.:."
      must_not_contain:
        # an ALT-indexed field is neither declared nor emitted
        - "ID=AF,"
        - "ID=AD,"
        - "ID=PL,"
        - "AF=0.5"

# --- one-sided contigs: a contig called by only one callset (synthetic 2-contig reference) ---
# Both scenarios share one pair of VCFs, swapped between the query and truth argument slots, so
# each direction of "contig present in one callset only" is covered without duplicate fixtures.

- name: test_one-sided-contig_query-only
  # Regression guard for #166: sc1 is called by both callsets, sc2 by the query only. The contig
  # is not skipped as empty (the query has variants there) but the truth callset contributes no
  # clusters, which used to dereference an empty clusters vector and segfault during
  # superclustering. The query call on sc2 has no truth counterpart, so it is a false positive.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/one_sided_contig_both.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/one_sided_contig_sc1only.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic_2ctg.bed"
    -p "one_sided_contig_query_only_"'
  files:
    - path: one_sided_contig_query_only_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t2\t2\t0\t2"
    - path: one_sided_contig_query_only_query.tsv
      contains:
        - "sc1\t199\t0\tA\tG\t50.00\tSNP\tTP"
        - "sc2\t49\t0\tT\tC\t50.00\tSNP\tFP"
        - "sc2\t49\t1\tT\tC\t50.00\tSNP\tFP"
    # the query calls on sc2, so the summary VCF reaches this contig; pinned as the mirror of the
    # truth-only direction below, where it used to be dropped
    - path: one_sided_contig_query_only_summary.vcf
      contains:
        - "sc2\t50\t.\tT\tC\t50\tPASS\t.\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE\t.:.:.:.:.:.:.:0:.:.:0:.:.:.:.\t1|1:FP,FP:0,0:.,.:.,.:.,.:50:0:0,0:0:0:0:.:0:."

- name: test_one-sided-contig_truth-only
  # The mirror of the case above: sc2 is called by the truth only. Superclustering used to
  # segfault here too, and the contig was then skipped entirely when scheduling superclusters for
  # evaluation, so its truth calls were never counted. Both sc2 haplotypes are false negatives.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/one_sided_contig_sc1only.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/one_sided_contig_both.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic_2ctg.bed"
    -p "one_sided_contig_truth_only_"'
  files:
    - path: one_sided_contig_truth_only_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t2\t2\t2\t0"
    - path: one_sided_contig_truth_only_truth.tsv
      contains:
        - "sc1\t199\t0\tA\tG\t50.00\tSNP\tTP"
        - "sc2\t49\t0\tT\tC\t50.00\tSNP\tFN"
        - "sc2\t49\t1\tT\tC\t50.00\tSNP\tFN"
    # regression guard for #174: sc2 has no query call, which used to skip the whole contig in the
    # summary VCF and drop these two false negatives. The query sample is empty and the truth
    # sample reports its own 1|1 call, one FN per allele.
    - path: one_sided_contig_truth_only_summary.vcf
      contains:
        - "sc2\t50\t.\tT\tC\t50\tPASS\t.\tGT:BD:BC:RD:QD:BK:QQ:SC:SG:PS:PB:BS:VP:FE:GE\t1|1:FN,FN:0,0:.,.:.,.:.,.:50:0:0,0:0:0:.:.:.:.\t.:.:.:.:.:.:.:0:.:.:0:.:.:.:."

# --- variants at reference position 0 (synthetic sc1 reference) ---

- name: test_contig-start-snp-scored-as-tp
  # Regression guard for #177: query and truth are identical, with one SNP at POS 1 (0-based
  # position 0) and one at POS 50, so every variant must be a true positive on both sides. The
  # alignment graph used to open directly on the position-0 variant node -- the aligner's fixed
  # origin -- leaving the parallel reference allele unreachable, so the call scored FP and its truth
  # counterpart was left unlabeled ("Unknown error type"), making TRUTH_TP + TRUTH_FN disagree with
  # the truth variant count. The POS 50 SNP is the mid-contig control, unaffected either way.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/contig_start_snp_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/contig_start_snp_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -p "contig_start_snp_out_"'
  stderr:
    must_not_contain:
      - "Unknown error type"
  files:
    - path: contig_start_snp_out_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t2\t2\t0\t0"
    - path: contig_start_snp_out_truth.tsv
      contains:
        - "sc1\t0\t0\tA\tG\t50.00\tSNP\tTP"
        - "sc1\t49\t0\tT\tC\t50.00\tSNP\tTP"
    - path: contig_start_snp_out_query.tsv
      contains:
        - "sc1\t0\t0\tA\tG\t50.00\tSNP\tTP"
        - "sc1\t49\t0\tT\tC\t50.00\tSNP\tTP"
      must_not_contain:
        - "\tSNP\tFP"

- name: test_contig-end-snp-scored-as-tp
  # The mirror of the scenario above, for #189: query and truth are identical, with one SNP at POS
  # 400 (0-based position 399, the final base of the 400 bp contig sc1) and one at POS 350, so every
  # variant must be a true positive on both sides. A variant on the final base is where the
  # reference window would otherwise reach past the contig end, leaving the graph's trailing node
  # holding no bases while its coordinate span claimed two. The POS 350 SNP is the mid-contig
  # control, whose window fits inside the contig and is unaffected by the clamp.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/contig_end_snp_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/contig_end_snp_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -p "contig_end_snp_out_"'
  stderr:
    must_not_contain:
      - "Unknown error type"
  files:
    - path: contig_end_snp_out_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t2\t2\t0\t0"
    - path: contig_end_snp_out_truth.tsv
      contains:
        - "sc1\t349\t0\tT\tC\t50.00\tSNP\tTP"
        - "sc1\t399\t0\tT\tC\t50.00\tSNP\tTP"
    - path: contig_end_snp_out_query.tsv
      contains:
        - "sc1\t349\t0\tT\tC\t50.00\tSNP\tTP"
        - "sc1\t399\t0\tT\tC\t50.00\tSNP\tTP"
      must_not_contain:
        - "\tSNP\tFP"

- name: test_filter_trailing-comma-names-no-extra-filter
  # swallowed_snps run again with a trailing comma on --filter. Every record in both callsets is
  # PASS, so the empty field after the comma must not become a filter name of its own: it would
  # resolve to no FILTER id and warn once per callset. Results must match the run without it.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/swallowed_snps_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/swallowed_snps_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -f "PASS,"
    -p "filter_trailing_comma_out_"'
  stderr:
    must_not_contain:
      - "Filter '' not found"
  files:
    - path: filter_trailing_comma_out_precision-recall-summary.tsv
      contains:
        - "SNP\tNONE\t0\t6\t6\t0\t0"
        - "SV\tNONE\t0\t0\t0\t2\t0"

- name: test_malformed-query-vcf-exits-nonzero
  # A query VCF whose header mis-declares GT as Float is rejected by htslib inside bcf_read.
  # Before #227 that read ended as though the file were empty and vcfdist exited 0 with a full
  # precision/recall table, indistinguishable from a caller that legitimately found nothing.
  command: bash -c '${VCFDIST_REPO_PATH}/src/vcfdist
    "${VCFDIST_REPO_PATH}/tests/integration/data/malformed_gt_type_query.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/swallowed_snps_truth.vcf"
    "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.fasta"
    -b "${VCFDIST_REPO_PATH}/tests/integration/data/synthetic.bed"
    -p "malformed_gt_type_out_"'
  exit_code: 1
  stderr:
    contains:
      - "Failed to parse record 1 of QUERY VCF"
