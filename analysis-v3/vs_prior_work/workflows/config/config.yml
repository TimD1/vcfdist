# --- Current-run input: pre-prepared data tree --------------------------------
# Path (relative to the pixi project dir analysis-v3/vs_prior_work) to data that
# is ALREADY downloaded + prepared -> resolves to analysis-v3/data. Layout:
#   <data_dir>/<id>-<version>/split/<id>.most.vcf.gz   (query + truth call sets)
#   <data_dir>/<truth-id>-<version>/split/bench.bed     (evaluation regions)
#   <data_dir>/refs/<reference.name>                     (+ .fai and .sdf)
# The benchmark run reads these directly and SKIPS the download/prep stages.
data_dir: "../data"

# Output directory and evaluation-regions BED. Defaults are the full genome-wide
# run; the `smoke` task overrides both (outdir=results-chr20, bench_bed=bench-chr20.bed)
# to run a fast chr20-only end-to-end check into a separate results tree.
outdir: "results"
bench_bed: "bench.bed"

# --- From-scratch reproducibility: download + prep -----------------------------
# These fields drive workflows/download.smk and workflows/rules/prep.smk, which
# are RETAINED for regenerating the data from scratch (not run in the current
# benchmark). cache_dir is where download.smk stages raw inputs.
cache_dir: "data"

reference:
  name: "GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta"
  url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz"

truth:
  id: "t2t-q100"
  version: "v0.9"
  sample: "HG002"
  vcf_url: "TODO: T2T-Q100 v0.9 HG002 truth VCF URL"
  bed_url: "TODO: T2T-Q100 v0.9 benchmark BED URL"

datasets:
  hprc:
    version: "v1"
    label: "hifiasm-dipcall"
    vcf_url: "TODO: HPRC v1 HG002 query VCF URL"
  pav:
    version: "v4"
    label: "Q100-PAV"
    vcf_url: "TODO: PAV v4 HG002 query VCF URL"
  giab-tr:
    version: "v4.20"
    label: "hifiasm-GIAB-TR"
    vcf_url: "TODO: GIAB-TR v4.20 HG002 query VCF URL"

params:
  sv_threshold: 50       # bp; indel/SV boundary
  max_sv_len: 1000       # bp; size cap (already applied in the provided *.most.vcf.gz)
  # vcfdist --credit-threshold (-ct): min partial credit to call a variant TP.
  # Set explicitly for BOTH v2 and v3 so the comparison is apples-to-apples
  # (v2.6.4 default is 0.70, v3.0.0 default is 0.98).
  credit_threshold: 0.98
  # vcfdist v3-ONLY flags (v2.6.4 lacks --max-dist / --max-retries and would error):
  max_dist: 1000       # -md, max edit distance for alignment
  max_retries: 10      # -mr, max realignment retries
  sample: "HG002"
  threads: 10
  max_ram_gb: 32         # vcfdist --max-ram, in GB
  vcfdist_v3_bin: "../../src/vcfdist"   # relative to analysis-v3/vs_prior_work
